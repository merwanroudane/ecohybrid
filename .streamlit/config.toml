[server]
runOnSave = true

[theme]
base = "light"
primaryColor = "#7c3aed"
backgroundColor = "#fcfbff"
secondaryBackgroundColor = "#f3f0ff"
textColor = "#1e1b4b"
linkColor = "#0369a1"
borderColor = "#e4defc"
codeBackgroundColor = "#f5f3ff"
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
font = "'IBM Plex Sans Arabic':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
headingFont = "Cairo:https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 16
headingFontWeights = [800, 700, 700, 600, 600, 600]
linkUnderline = false
chartCategoricalColors = ["#7c3aed", "#0d9488", "#f97316", "#0284c7", "#e11d48", "#65a30d", "#db2777", "#d97706", "#4f46e5", "#0891b2"]
redColor = "#e11d48"
orangeColor = "#ea580c"
yellowColor = "#ca8a04"
greenColor = "#059669"
blueColor = "#0284c7"
violetColor = "#7c3aed"
grayColor = "#64748b"

[theme.sidebar]
backgroundColor = "#f5f3ff"
secondaryBackgroundColor = "#ede9fe"
textColor = "#1e1b4b"
borderColor = "#ddd6fe"
primaryColor = "#6d28d9"
